<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="t d">
<title id="t">ReflectoSim synthetic XRR generation pipeline</title><desc id="d">A TOML prior samples physical stacks and instruments; ReflectoFit evaluates forward reflectivity; a separate random stream produces Poisson counts; arrays and metadata are saved.</desc>
<style>text{font-family:Arial,sans-serif;fill:#eaf1ff}.h{font-weight:700;font-size:23px}.s{font-size:16px}.tiny{font-size:14px;fill:#a9bcd8}.box{fill:#18253d;stroke:#5688bc;stroke-width:2}.arrow{stroke:#7ec9ed;stroke-width:3;fill:none;marker-end:url(#a)}.tag{font-size:15px;fill:#a7e8cd}</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#7ec9ed"/></marker></defs>
<rect width="1100" height="420" rx="24" fill="#0e1728"/>
<text x="42" y="49" class="h">ReflectoSim: from priors to training data</text>
<rect class="box" x="40" y="96" rx="14" width="215" height="165"/><text x="60" y="135" class="h">TOML priors</text><text x="60" y="165" class="s">layer count / d / SLD</text><text x="60" y="189" class="s">roughness / oxide</text><text x="60" y="213" class="s">instrument / counts</text><text x="60" y="242" class="tag">seed: parameter stream</text>
<rect class="box" x="307" y="96" rx="14" width="219" height="165"/><text x="327" y="135" class="h">Sample rows</text><text x="327" y="165" class="s">physical stacks</text><text x="327" y="189" class="s">instrument settings</text><text x="327" y="213" class="s">packed media arrays</text><text x="327" y="242" class="tag">reproducible inputs</text>
<rect class="box" x="580" y="96" rx="14" width="215" height="165"/><text x="600" y="135" class="h">ReflectoFit</text><text x="600" y="165" class="s">forward(q, stack, inst)</text><text x="600" y="189" class="s">resolution / footprint</text><text x="600" y="213" class="s">offset / background</text><text x="600" y="242" class="tag">pre-noise intensity</text>
<rect class="box" x="848" y="96" rx="14" width="210" height="165"/><text x="868" y="135" class="h">Poisson draw</text><text x="868" y="165" class="s">mean = scale ×</text><text x="868" y="189" class="s">pre-noise signal</text><text x="868" y="213" class="s">counts ~ Poisson(mean)</text><text x="868" y="242" class="tag">seed: noise stream</text>
<path class="arrow" d="M255 178 H307"/><path class="arrow" d="M526 178 H580"/><path class="arrow" d="M795 178 H848"/>
<path d="M952 261 V308 H152 V261" stroke="#7ec9ed" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
<rect class="box" x="285" y="326" rx="13" width="530" height="59"/><text x="310" y="361" class="s">NPZ / HDF5: q, counts, reflectivity, parameters, metadata</text>
<path class="arrow" d="M550 308 V326"/><text x="42" y="305" class="tiny">Parameter sampling and counting noise use separate RNG streams.</text>
</svg>