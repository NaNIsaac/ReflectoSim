<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 685" role="img" aria-labelledby="title desc">
<title id="title">Comparable prior intervals with meaningful numerical axes</title>
<desc id="desc">Thicknesses share one 0 to 250 angstrom scale; real SLDs share 0 to 80 scale; instrument q resolution has its own 0 to 0.003 inverse angstrom scale. Segments begin at configured minima, not zero. No sampled frequencies are shown.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7efff}.title{font-size:25px;font-weight:700}.note{font-size:15px;fill:#aabbd4}.head{font-size:19px;font-weight:700;fill:#9ddff2}.name{font-size:18px}.tick{font-size:14px;fill:#9eb0c8}.val{font-size:16px;fill:#b6efd1}.grid{stroke:#304460;stroke-width:1}.bar{stroke:#47c4e2;stroke-width:11;stroke-linecap:round}.oxide{stroke:#efa96a;stroke-width:11;stroke-linecap:round}.dot{fill:#f8fafc}</style>
<rect width="1060" height="685" rx="18" fill="#101a2b"/>
<text x="34" y="48" class="title">The prior is not a 100%-filled bar</text><text x="34" y="73" class="note">Intervals plotted at their actual positions on a shared numeric scale per physical quantity</text>
<text x="35" y="119" class="head">THICKNESS / ROUGHNESS · Å</text>
<g><line class="grid" x1="300" x2="300" y1="148" y2="302"/><line class="grid" x1="420" x2="420" y1="148" y2="302"/><line class="grid" x1="540" x2="540" y1="148" y2="302"/><line class="grid" x1="660" x2="660" y1="148" y2="302"/><line class="grid" x1="780" x2="780" y1="148" y2="302"/><line class="grid" x1="900" x2="900" y1="148" y2="302"/></g>
<g class="tick"><text x="295" y="141">0</text><text x="411" y="141">50</text><text x="527" y="141">100</text><text x="647" y="141">150</text><text x="767" y="141">200</text><text x="887" y="141">250</text></g>
<text x="35" y="184" class="name">Film thickness</text><line class="bar" x1="348" y1="179" x2="900" y2="179"/><circle class="dot" cx="348" cy="179" r="4"/><circle class="dot" cx="900" cy="179" r="4"/><text x="917" y="184" class="val">20–250</text>
<text x="35" y="239" class="name">Oxide thickness</text><line class="oxide" x1="312" y1="234" x2="360" y2="234"/><circle class="dot" cx="312" cy="234" r="4"/><circle class="dot" cx="360" cy="234" r="4"/><text x="381" y="239" class="val">5–25</text>
<text x="35" y="294" class="name">Film roughness σ</text><line class="bar" x1="304.8" y1="289" x2="324" y2="289"/><circle class="dot" cx="304.8" cy="289" r="4"/><circle class="dot" cx="324" cy="289" r="4"/><text x="346" y="294" class="val">2–10</text>
<text x="35" y="332" class="note">Additional constraint: film σ ≤ d/4. Intervals alone do not imply independent draws.</text>
<text x="35" y="387" class="head">REAL SCATTERING LENGTH DENSITY · 10⁻⁶ Å⁻²</text>
<g><line class="grid" x1="300" x2="300" y1="417" y2="511"/><line class="grid" x1="450" x2="450" y1="417" y2="511"/><line class="grid" x1="600" x2="600" y1="417" y2="511"/><line class="grid" x1="750" x2="750" y1="417" y2="511"/><line class="grid" x1="900" x2="900" y1="417" y2="511"/></g>
<g class="tick"><text x="295" y="411">0</text><text x="439" y="411">20</text><text x="589" y="411">40</text><text x="739" y="411">60</text><text x="889" y="411">80</text></g>
<text x="35" y="454" class="name">Film Re(SLD)</text><line class="bar" x1="337.5" y1="449" x2="900" y2="449"/><circle class="dot" cx="337.5" cy="449" r="4"/><circle class="dot" cx="900" cy="449" r="4"/><text x="916" y="454" class="val">5–80</text>
<text x="35" y="501" class="name">Oxide Re(SLD)</text><line class="oxide" x1="429" y1="496" x2="447.75" y2="496"/><circle class="dot" cx="429" cy="496" r="4"/><circle class="dot" cx="447.75" cy="496" r="4"/><text x="473" y="501" class="val">17.2–19.7</text>
<text x="35" y="546" class="head">GAUSSIAN q RESOLUTION · Å⁻¹</text>
<g><line class="grid" x1="300" x2="300" y1="574" y2="635"/><line class="grid" x1="500" x2="500" y1="574" y2="635"/><line class="grid" x1="700" x2="700" y1="574" y2="635"/><line class="grid" x1="900" x2="900" y1="574" y2="635"/></g>
<g class="tick"><text x="295" y="569">0</text><text x="482" y="569">0.001</text><text x="682" y="569">0.002</text><text x="882" y="569">0.003</text></g>
<text x="35" y="611" class="name">σq</text><line class="bar" x1="400" y1="606" x2="900" y2="606"/><circle class="dot" cx="400" cy="606" r="4"/><circle class="dot" cx="900" cy="606" r="4"/><text x="362" y="650" class="val">0.0005</text><text x="830" y="650" class="val">0.003</text>
<text x="35" y="674" class="note">Configured bounds, not histograms or measured data · examples/lab_films.toml</text>
</svg>