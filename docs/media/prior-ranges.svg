<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d">
<title id="t">Ranges defined by the lab films example prior</title><desc id="d">Uniform interval bounds for thickness, roughness, SLD, oxide thickness and resolution. Plots show allowable prior ranges, not sampled frequencies or measured distributions.</desc>
<style>text{font-family:Arial,sans-serif;fill:#eaf1ff}.h{font-size:23px;font-weight:700}.sub{font-size:15px;fill:#a9bcd8}.label{font-size:19px}.val{font-size:16px;fill:#a8e6d2}.track{fill:#273854}.range{fill:#55b7d7}.tick{stroke:#7890b6;stroke-width:1}</style>
<rect width="1000" height="530" rx="22" fill="#0e1728"/><text x="40" y="53" class="h">Example prior bounds</text><text x="40" y="78" class="sub">Source: examples/lab_films.toml · intervals are uniform sampling bounds, NOT observations</text>
<text x="40" y="126" class="label">Film thickness</text><rect class="track" x="330" y="103" width="560" height="29" rx="7"/><rect class="range" x="330" y="103" width="560" height="29" rx="7"/><text x="330" y="151" class="val">20 Å</text><text x="844" y="151" class="val">250 Å</text>
<text x="40" y="215" class="label">Film roughness</text><rect class="track" x="330" y="192" width="560" height="29" rx="7"/><rect class="range" x="330" y="192" width="560" height="29" rx="7"/><text x="330" y="240" class="val">2 Å</text><text x="846" y="240" class="val">10 Å</text>
<text x="40" y="304" class="label">Film Re(SLD)</text><rect class="track" x="330" y="281" width="560" height="29" rx="7"/><rect class="range" x="330" y="281" width="560" height="29" rx="7"/><text x="330" y="329" class="val">5</text><text x="843" y="329" class="val">80</text><text x="40" y="346" class="sub">SLD units: 10⁻⁶ Å⁻²</text>
<text x="40" y="398" class="label">Oxide thickness</text><rect class="track" x="330" y="375" width="560" height="29" rx="7"/><rect class="range" x="330" y="375" width="560" height="29" rx="7"/><text x="330" y="423" class="val">5 Å</text><text x="846" y="423" class="val">25 Å</text>
<text x="40" y="487" class="label">Gaussian σq</text><rect class="track" x="330" y="464" width="560" height="29" rx="7"/><rect class="range" x="330" y="464" width="560" height="29" rx="7"/><text x="330" y="513" class="val">0.0005 Å⁻¹</text><text x="796" y="513" class="val">0.003 Å⁻¹</text>
</svg>